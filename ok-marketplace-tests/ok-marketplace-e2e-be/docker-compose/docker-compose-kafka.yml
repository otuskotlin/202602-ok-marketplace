version: '2.4'
services:
  kafka:
    image: apache/kafka:latest
    ports:
      - '9092:9092'
    expose:
      - '19092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    healthcheck:
      # Проверяем не просто открытие TCP-порта, а реальную готовность брокера отвечать на запросы
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

#  kafdrop:
#    image: obsidiandynamics/kafdrop
#    restart: "no"
#    ports:
#      - "9000:9000"
#    environment:
#      KAFKA_BROKERCONNECT: "kafka:9092"
#      JVM_OPTS: "-Xms16M -Xmx48M -Xss180K -XX:-TieredCompilation -XX:+UseStringDeduplication -noverify"
#    depends_on:
#      - "kafka"
#    networks:
#      - app-tier

  app-kafka:
    image: ok-marketplace-app-kafka:0.0.1
    depends_on:
      - kafka
    links:
      - kafka
    environment:
      KAFKA_HOSTS: kafka:19092
#      KAFKA_TOPIC_IN_V1: marketplace-ad-v1-in
#      KAFKA_TOPIC_OUT_V1: marketplace-ad-v1-out
#      KAFKA_TOPIC_IN_V2: marketplace-ad-v2-in
#      KAFKA_TOPIC_OUT_V2: marketplace-ad-v2-out

networks:
  app-tier:
    driver: bridge